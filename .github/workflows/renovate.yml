name: Renovate

on:
  schedule:
    - cron: "*/30 * * * *" # Every hour at minutes 0 and 30.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.repository == 'amyu/setup-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Create Renovate token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: setup-android

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ steps.app-token.outputs.token }}
