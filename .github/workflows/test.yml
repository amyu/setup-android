name: build-test
on:
  pull_request:

jobs:
  test:
    name: run test ${{ matrix.os }} sdkversion ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: [35, 36, "37.0"]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.sdk }}-test
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: remove android sdk from ubuntu-latest
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_SDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_NDK=' >> $GITHUB_ENV
          rm -rf ~/android

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: ./
        with:
          cache-disabled: false
          sdk-version: ${{ matrix.sdk }}
          build-tools-version: 36.0.0
          cmake-version: 3.31.6
          ndk-version: 28.2.13676358

      - run: |
          ./sample-android-project/gradlew -p sample-android-project assembleDebug --stacktrace

  test_not_use_cache:
    name: run test not use cache ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-test_not_use_cache
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: remove android sdk from ubuntu-latest
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_SDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_NDK=' >> $GITHUB_ENV
          rm -rf ~/android

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: ./
        with:
          cache-disabled: true
          sdk-version: "37.0"
          build-tools-version: 36.0.0
          cmake-version: 3.31.6
          ndk-version: 28.2.13676358

      - run: |
          ./sample-android-project/gradlew -p sample-android-project assembleDebug --stacktrace

  test_check_cmdline_tools_path:
    name: run check cmdline-tools path ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-test_check_cmdline_tools_path
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: remove android sdk from ubuntu-latest
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_SDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_NDK=' >> $GITHUB_ENV
          rm -rf ~/android

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: ./
        with:
          cache-disabled: true

      - run: |
          sdkmanager --install "system-images;android-31;default;x86_64"

  test_android_minor_sdk_version:
    name: run test android minor sdk version ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [37, "37.0"]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.sdk }}-test_android_minor_sdk_version
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: remove android sdk from ubuntu-latest
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_SDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_NDK=' >> $GITHUB_ENV
          rm -rf ~/android

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: ./
        with:
          cache-disabled: true
          sdk-version: ${{ matrix.sdk }}

      - run: |
          sdkmanager --list_installed | grep "platforms;android-37.0"

  test_unavailable_codename_sdk_version_error:
    name: run test unavailable codename sdk version error
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify unavailable codename SDK version error
        shell: bash
        run: |
          set +e
          env \
            'INPUT_SDK-VERSION=UnavailableCodenameForTest' \
            'INPUT_CACHE-DISABLED=true' \
            'INPUT_COMMAND-LINE-TOOLS-VERSION=15859902' \
            node dist/setup/index.js 2>&1 | tee "$RUNNER_TEMP/setup-android.log"
          status=${PIPESTATUS[0]}
          set -e

          test "$status" -ne 0
          grep -F 'codename-based Android SDK platform "platforms;android-UnavailableCodenameForTest"' \
            "$RUNNER_TEMP/setup-android.log"
          grep -F 'Codename values are supported when their exact package IDs are published' \
            "$RUNNER_TEMP/setup-android.log"

  test_custom_cache_key:
    name: run test custom cache key ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-test_custom_cache_key
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: remove android sdk from ubuntu-latest
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_SDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_NDK=' >> $GITHUB_ENV
          rm -rf ~/android

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: ./
        with:
          cache-key: custom-cache-key-on-${{matrix.os}}

      - run: |
          sdkmanager --install emulator

  test_install_multiple_sdk_version:
    name: run test install multiple sdk ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-test_install_multiple_sdk_version
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: remove android sdk from ubuntu-latest
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_SDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_NDK=' >> $GITHUB_ENV
          rm -rf ~/android

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: ./
        with:
          sdk-version: |
            36
            37.0

      - run: |
          sdkmanager --list_installed

  test_command_line_tools_version:
    name: run test ${{ matrix.os }} command-line-tools-version ${{ matrix.command-line-tools-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        command-line-tools-version: [13114758, 12266719, 11479570]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.command-line-tools-version }}-test_command_line_tools_version
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: remove android sdk from ubuntu-latest
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_SDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_NDK=' >> $GITHUB_ENV
          rm -rf ~/android

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: ./
        with:
          command-line-tools-version: ${{ matrix.command-line-tools-version }}

      - run: |
          ./sample-android-project/gradlew -p sample-android-project assembleDebug --stacktrace

  test_command_line_tools_mac_architecture:
    name: run test ${{ matrix.os }} command-line-tools architecture ${{ matrix.node_architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            node_architecture: x64
            expected_url: https://dl.google.com/android/repository/commandlinetools-mac_x86_64-15859902_latest.zip
          - os: macos-latest
            node_architecture: arm64
            expected_url: https://dl.google.com/android/repository/commandlinetools-mac_arm64-15859902_latest.zip
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-test_command_line_tools_mac_architecture
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove preinstalled Android SDK
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=' >> "$GITHUB_ENV"
          echo 'ANDROID_NDK_ROOT=' >> "$GITHUB_ENV"
          echo 'ANDROID_NDK_HOME=' >> "$GITHUB_ENV"
          echo 'ANDROID_NDK=' >> "$GITHUB_ENV"
          rm -rf ~/android

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK and verify the command-line tools URL
        shell: bash
        env:
          EXPECTED_NODE_ARCHITECTURE: ${{ matrix.node_architecture }}
          EXPECTED_URL: ${{ matrix.expected_url }}
        run: |
          test "$(node -p process.arch)" = "$EXPECTED_NODE_ARCHITECTURE"
          env \
            'INPUT_SDK-VERSION=37.0' \
            'INPUT_CACHE-DISABLED=true' \
            'INPUT_COMMAND-LINE-TOOLS-VERSION=15859902' \
            node dist/setup/index.js 2>&1 | tee "$RUNNER_TEMP/setup-android.log"
          grep -F "start download cmdline-tools url: $EXPECTED_URL" \
            "$RUNNER_TEMP/setup-android.log"

      - run: |
          sdkmanager --version

  test_install_multiple_build_tools_version:
    name: run test install multiple build-tools-version ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-test_install_multiple_build_tools_version
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: remove android sdk from ubuntu-latest
        shell: bash
        run: |
          echo 'ANDROID_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_SDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_ROOT=' >> $GITHUB_ENV
          echo 'ANDROID_NDK_HOME=' >> $GITHUB_ENV
          echo 'ANDROID_NDK=' >> $GITHUB_ENV
          rm -rf ~/android

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: jetbrains
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: ./
        with:
          build-tools-version: |
            34.0.0
            35.0.0
            36.0.0

      - run: |
          sdkmanager --list_installed
