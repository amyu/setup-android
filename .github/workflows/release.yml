name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v6.0)"
        required: true
        type: string

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Tag and publish the selected main commit
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const version = context.payload.inputs.version;
            if (!/^v[0-9]+\.[0-9]+$/.test(version)) {
              throw new Error('Expected a release version in the form v<major>.<minor>.');
            }
            try {
              await github.rest.git.createRef({
                ...context.repo,
                ref: `refs/tags/${version}`,
                sha: context.sha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              // Allow publication to resume if tag creation succeeded on a previous attempt.
              const { data: tag } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${version}` });
              if (tag.object.type !== 'commit' || tag.object.sha !== context.sha) throw error;
            }
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: version,
              target_commitish: context.sha,
              name: version,
              generate_release_notes: true,
            });
            console.log(`Created release: ${release.html_url}`);

      - name: Update README and create PR
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const version = context.payload.inputs.version;
            const path = 'README.md';
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo, path, ref: context.sha,
            });
            const readme = Buffer.from(file.content, 'base64').toString('utf8');
            const updatedReadme = readme.replace(
              /\buses: amyu\/setup-android@v\d+\.\d+(?=\s|$)/g,
              `uses: amyu/setup-android@${version}`
            );
            if (updatedReadme === readme) {
              console.log('No README updates needed.');
              return;
            }
            const branch = `release/update-readme-${version}`;
            await github.rest.git.createRef({
              ...context.repo, ref: `refs/heads/${branch}`, sha: context.sha,
            });
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path, branch, sha: file.sha,
              message: `docs: update README for ${version}`,
              content: Buffer.from(updatedReadme).toString('base64'),
            });

            // Create a PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `docs: update README for ${version}`,
              body: `Update README examples to use \`amyu/setup-android@${version}\`.`,
              head: branch,
              base: context.payload.repository.default_branch,
            });
            console.log(`Created PR: ${pr.html_url}`);
